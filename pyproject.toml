[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "pyvicsek"
version = "0.2.0"
description = "Simulation of the Vicsek model of collective motion in N dimensions, with periodic boundaries and heterogeneous particle types"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Mehtan Rahman", email = "mehtan.rahman@utexas.edu"},
]
maintainers = [
    {name = "Mehtan Rahman", email = "mehtan.rahman@utexas.edu"},
]
keywords = ["vicsek", "collective motion", "active matter", "self-propelled particles", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy",
  "matplotlib",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis"]

[project.urls]
Repository = "https://github.com/mehtan-rahman/PyVicsek"
Issues = "https://github.com/mehtan-rahman/PyVicsek/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# The pure-Python package; CMakeLists.txt adds the vicsek._kernel extension.
wheel.packages = ["src/vicsek"]
# Stable ABI (abi3) wheel on CPython 3.12+, version-specific wheels for 3.10/3.11.
wheel.py-api = "cp312"
sdist.exclude = ["scripts/", "docs/", ".github/", "dist/", "build/", ".hypothesis/", "requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
