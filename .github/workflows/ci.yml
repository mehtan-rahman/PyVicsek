name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # kernel: the C++ extension (built with the runner's gcc) is used by default;
        # numpy: the same suite with VICSEK_NO_KERNEL=1, so the numpy path is the default.
        # Both runs include tests/test_kernel.py, which switches between the two explicitly.
        backend: [kernel, numpy]
    env:
      VICSEK_NO_KERNEL: ${{ matrix.backend == 'numpy' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (builds the C++ kernel) with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Check the kernel was built
        # The build skips the extension with a warning when no compiler is found;
        # here a compiler is available, so a missing kernel is an error.
        run: python -c "import vicsek; assert vicsek.kernel_available(); print('kernel enabled:', vicsek.kernel_enabled())"

      - name: Run tests with coverage
        run: pytest --cov=vicsek --cov-report=xml --cov-report=term --cov-fail-under=100

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: ${{ matrix.backend }}
          fail_ci_if_error: false

  pure-python:
    name: install without the kernel (numpy only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with the extension switched off
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" -Ccmake.define.VICSEK_KERNEL=OFF

      - name: Run tests (kernel tests skip; coverage not enforced here)
        run: |
          python -c "import vicsek; assert not vicsek.kernel_available()"
          pytest -q

  benchmark:
    name: cell-list benchmark (Python 3.12)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run benchmark (small sizes)
        run: python benchmarks/bench_cell_list.py --quick
